name: Build iOS

# An unsigned IPA for sideloading (AltStore, SideStore or any signing tool signs it with your Apple ID when it
# installs it). On every push to main, or by hand with a release tag to attach the IPA to.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to put the IPA on (e.g. v1.0.0; made as a draft if it isn't there). Empty = run artifact only.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: HubKit (byte-for-byte against the watch hosts)
        run: cd ios/HubKit && swift test
      - name: WireKit
        run: cd ios/WireKit && swift test

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # the newest Xcode on the runner (the iOS 26 SDK: Liquid Glass; the app runs from iOS 17)
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
      # WABridge: whatsmeow for the WhatsApp watch app, built with gomobile before xcodegen links it
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ios/WABridge/go.sum
      - name: WABridge (whatsmeow via gomobile)
        run: bash ios/WABridge/build.sh
      - name: XcodeGen
        run: brew install xcodegen xcbeautify
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          # Settings › Secrets and variables › Actions; empty: typed in the app instead
          CMFX_SPOTIFY_CLIENT_ID: ${{ secrets.CMFX_SPOTIFY_CLIENT_ID }}
          CMFX_GEMINI_KEY: ${{ secrets.CMFX_GEMINI_KEY }}
          CMFX_GOOGLE_CLIENT_ID: ${{ secrets.CMFX_GOOGLE_CLIENT_ID }}
        run: bash ios/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CMFX-iOS
          path: ios/dist/CMFX.ipa
          if-no-files-found: error
      - name: Release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" --draft --title "${{ inputs.tag }}" --notes ""
          gh release upload "${{ inputs.tag }}" ios/dist/CMFX.ipa --clobber
